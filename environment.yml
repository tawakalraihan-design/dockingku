# Pasang: mamba env create -f environment.yml  lalu  conda activate dockingku
name: dockingku
channels: [conda-forge]
dependencies:
  - python=3.11
  - rdkit
  - openbabel
  - meeko           # persiapan PDBQT ligan dan reseptor
  - pdbfixer        # membersihkan protein (pengganti BIOVIA)
  - openmm
  - plip            # profil interaksi protein-ligan
  - fastapi
  - uvicorn
  - httpx
  - pywebview
  - pytest
  # Vina: di Windows pakai vina.exe resmi di tools\vina\vina.exe (lihat README);
  #       di Linux/macOS boleh tambahkan paket `vina` dari conda-forge.
  # Opsional: openjdk=17 untuk P2Rank lokal
